kind = "web"
previewPath = "/"
title = "Nexus Launcher"
version = "1.0.0"
id = "artifacts/nexus-launcher"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22972

[services.development]
run = "pnpm --filter @workspace/nexus-launcher run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexus-launcher", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexus-launcher/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22972"
BASE_PATH = "/"
